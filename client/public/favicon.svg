<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="faceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="faceGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura background glow -->
  <circle cx="32" cy="32" r="28" fill="url(#diceGrad)" opacity="0.2" filter="url(#glow)" />

  <!-- D20 Outer Hexagon -->
  <polygon points="32,4 57,18 57,46 32,60 7,46 7,18" fill="#0f172a" stroke="url(#diceGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- D20 Internal Faces (Icosahedron projection) -->
  <!-- Center Triangle -->
  <polygon points="32,18 47,44 17,44" fill="url(#faceGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Top Vertex Triangles -->
  <polygon points="32,4 17,18 32,18" fill="#1e1b4b" stroke="#9333ea" stroke-width="1" stroke-linejoin="round" />
  <polygon points="32,4 32,18 47,18" fill="#311042" stroke="#9333ea" stroke-width="1" stroke-linejoin="round" />

  <!-- Side Triangles Upper -->
  <polygon points="7,18 17,18 17,44" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" />
  <polygon points="57,18 47,18 47,44" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" />
  <polygon points="7,18 32,4 17,18" fill="#090d16" stroke="#9333ea" stroke-width="1" />
  <polygon points="57,18 32,4 47,18" fill="#090d16" stroke="#9333ea" stroke-width="1" />

  <!-- Side Triangles Lower -->
  <polygon points="7,46 17,44 7,18" fill="#0f172a" stroke="#64748b" stroke-width="1" stroke-linejoin="round" />
  <polygon points="57,46 47,44 57,18" fill="#0f172a" stroke="#64748b" stroke-width="1" stroke-linejoin="round" />

  <!-- Bottom Triangles -->
  <polygon points="32,60 17,44 32,44" fill="#1e1b4b" stroke="#9333ea" stroke-width="1" stroke-linejoin="round" />
  <polygon points="32,60 32,44 47,44" fill="#311042" stroke="#9333ea" stroke-width="1" stroke-linejoin="round" />
  <polygon points="7,46 17,44 32,60" fill="#090d16" stroke="#64748b" stroke-width="1" />
  <polygon points="57,46 47,44 32,60" fill="#090d16" stroke="#64748b" stroke-width="1" />

  <!-- Number 20 on Center Triangle -->
  <text x="32" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 0 2px #000)">20</text>
</svg>
